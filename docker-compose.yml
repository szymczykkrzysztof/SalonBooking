services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: salonbooking
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.sample to .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salonbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: